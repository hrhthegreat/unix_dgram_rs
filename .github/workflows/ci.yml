name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo fmt -- --check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: "*.node"

  test-runtime:
    needs: build-native
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [16, 20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: .
      - run: npm test
